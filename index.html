<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Roue de la Fortune</title>
    <style>
        :root {
            --bg-color: #2c1810;
            --wood-light: #8B4513;
            --wood-dark: #5C2E00;
            --gold: #FFD700;
            --cream: #FDF5E6;
            --red: #8B0000;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--cream);
            margin: 0;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex-direction: column; 
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background: linear-gradient(145deg, #4a2c1a, #2c1810);
            border: 4px solid var(--wood-light);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            padding: 10px;
        }

        /* Mode Ordinateur (écran large) */
        @media (min-width: 768px) {
            #game-container {
                flex-direction: row;
                height: 90vh;
                border-width: 8px;
                border-radius: 20px;
                padding: 20px;
            }
        }

        /* Partie Gauche / Haute : Roue */
        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 0;
        }

        #wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
        }

        @media (min-width: 768px) {
            #wheel-container { width: 350px; height: 350px; }
            canvas { width: 350px !important; height: 350px !important; }
        }

        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid var(--gold);
            z-index: 10;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
        }

        canvas {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        #spin-btn {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 20px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: var(--wood-dark);
            background: linear-gradient(to bottom, var(--gold), #daa520);
            border: 2px solid var(--wood-dark);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            z-index: 5;
        }

        #spin-btn:disabled {
            background: linear-gradient(to bottom, #666, #444);
            color: #aaa;
            cursor: not-allowed;
        }

        /* Guirlandes */
        #garland {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 25px;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 20;
        }

        .bulb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #333;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }
        .bulb.on { background-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .bulb.red.on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .bulb.green.on { background-color: #33ff33; box-shadow: 0 0 8px #33ff33; }
        .bulb.blue.on { background-color: #3399ff; box-shadow: 0 0 8px #3399ff; }

        /* Partie Droite / Basse : Expression */
        #right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            #right-panel { padding-left: 40px; }
        }

        #phrase-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .letter-box {
            width: 28px;
            height: 36px;
            border-bottom: 3px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--gold);
        }
        @media (min-width: 768px) {
            .letter-box { width: 40px; height: 50px; font-size: 32px; }
            #phrase-display { gap: 10px; }
        }

        .space-box { width: 14px; border-bottom: none; }
        @media (min-width: 768px) { .space-box { width: 20px; } }

        #message {
            height: 40px;
            font-size: 16px;
            color: #ff9999;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }
        @media (min-width: 768px) { #message { font-size: 20px; margin-bottom: 20px; } }

        #bottom-panel {
            position: absolute;
            bottom: 10px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 5;
        }

        #score-display {
            font-size: 20px;
            color: var(--gold);
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        @media (min-width: 768px) { #score-display { font-size: 28px; margin-bottom: 15px; } }

        /* Bouton Rose "Retour au village" */
        #quit-btn {
            display: inline-block;
            padding: 8px 15px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            background-color: #FF69B4; /* Rose vif */
            color: #fff;
            border: 2px solid #FF1493; /* Bordure rose foncé */
            border-radius: 20px;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #quit-btn:hover { 
            background-color: #FF1493; 
            color: #fff; 
        }

        /* Champ texte invisible pour déclencher le clavier mobile */
        #mobile-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="garland"></div>
    
    <!-- Input invisible pour le clavier tactile -->
    <input type="text" id="mobile-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div id="left-panel">
        <div id="wheel-container">
            <div id="pointer"></div>
            <canvas id="wheel" width="350" height="350"></canvas>
        </div>
        <button id="spin-btn" onclick="spinWheel()">TOURNER</button>
    </div>

    <div id="right-panel">
        <div id="phrase-display"></div>
        <div id="message">Appuyez sur "Tourner" !</div>
    </div>

    <div id="bottom-panel">
        <div id="score-display">Pièces : 0</div>
        <!-- Lien modifié avec la couleur et l'URL demandées -->
        <a id="quit-btn" href="https://pierreg78-maker.github.io/village/">Retour au Village</a>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const expressions = [
        "Le champagne est à la bouche ce que le clair de lune est au cœur",
        "Une hirondelle ne fait pas le printemps",
        "Petit à petit l'oiseau fait son nid",
        "Quand les poules auront des dents",
        "C'est la cerise sur le gâteau",
        "Avoir le cafard",
        "Tomber dans les pommes",
        "En avoir ras le bol"
    ];

    // 12 cases dans l'ordre exact demandé
    // X représente la banqueroute pour prendre moins de place visuellement sur la roue
    const segments = [0, 10, "X", 5, 1, 2, 0, 10, "X", 5, 1, 2];
    
    // Couleurs associées pour bien distinguer les valeurs
    // Gris=0, Vert=10, Rouge=X, Bleu=5, Jaune=1, Violet=2
    const colors = ["#555555", "#006400", "#800000", "#00008B", "#808000", "#4B0082", "#666666", "#228B22", "#B22222", "#191970", "#BDB76B", "#6A0DAD"];
    
    const voyelles = ["a", "e", "i", "o", "u", "y"];

    // --- ÉTAT DU JEU ---
    let currentExpression = "";
    let normalizedExpression = "";
    let revealedLetters = [];
    let score = 0;
    let currentWheelValue = 0;
    let canGuess = false;
    let isSpinning = false;
    let gameWon = false;

    // --- ROUE (Canvas) ---
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;
    let startAngle = 0;
    
    function drawWheel() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle);

        for (let i = 0; i < numSegments; i++) {
            const angle = i * arcSize;
            
            ctx.beginPath();
            ctx.arc(0, 0, radius - 5, angle, angle + arcSize);
            ctx.lineTo(0, 0);
            ctx.closePath();
            ctx.fillStyle = colors[i];
            ctx.fill();
            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.save();
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px Georgia";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            
            // Affiche directement la valeur (0, 1, 2, 5, 10, ou X)
            ctx.fillText(segments[i], radius - 25, 8);
            ctx.restore();
        }
        ctx.restore();
    }

    // --- MÉCANIQUE ROUE ---
    function spinWheel() {
        if (isSpinning || gameWon) return;
        isSpinning = true;
        canGuess = false;
        document.getElementById("spin-btn").disabled = true;
        document.getElementById("message").innerText = "La roue tourne...";
        
        document.getElementById("mobile-input").blur();

        let spinVelocity = Math.random() * 0.3 + 0.3; 
        const friction = 0.988;

        function animate() {
            spinVelocity *= friction;
            startAngle += spinVelocity;
            drawWheel();

            if (spinVelocity > 0.002) {
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                determinePrize();
            }
        }
        animate();
    }

    function determinePrize() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        let pointerAngleInWheelFrame = (-Math.PI / 2 - startAngle) % (2 * Math.PI);
        if (pointerAngleInWheelFrame < 0) pointerAngleInWheelFrame += 2 * Math.PI;
        
        const index = Math.floor(pointerAngleInWheelFrame / arcSize);
        currentWheelValue = segments[index];

        // On vérifie maintenant si la valeur est "X" (Banqueroute)
        if (currentWheelValue === "X") {
            score = 0;
            updateScoreDisplay();
            document.getElementById("message").innerText = "Banqueroute ! Vous perdez tout.";
            document.getElementById("spin-btn").disabled = false;
        } else {
            document.getElementById("message").innerText = `Valeur : ${currentWheelValue} pièce(s). Tapez une lettre !`;
            canGuess = true;
            document.getElementById("mobile-input").focus();
        }
    }

    // --- EXPRESSIONS & LETTRES ---
    function normalizeString(str) {
        return str.toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
                  .replace(/ç/g, "c"); 
    }

    function initGame() {
        currentExpression = expressions[Math.floor(Math.random() * expressions.length)];
        normalizedExpression = normalizeString(currentExpression);
        revealedLetters = new Array(currentExpression.length).fill(false);
        score = 0;
        gameWon = false;
        canGuess = false;
        currentWheelValue = 0;
        
        updateScoreDisplay();
        renderPhrase();
        drawWheel();
        turnOffGarland();
        
        document.getElementById("message").innerText = 'Appuyez sur "Tourner" !';
        document.getElementById("spin-btn").disabled = false;
        document.getElementById("mobile-input").value = "";
        document.getElementById("mobile-input").blur();
    }

    function renderPhrase() {
        const container = document.getElementById("phrase-display");
        container.innerHTML = "";
        
        for (let i = 0; i < currentExpression.length; i++) {
            const char = currentExpression[i];
            
            if (char === " ") {
                const space = document.createElement("div");
                space.className = "letter-box space-box";
                container.appendChild(space);
            } else {
                const box = document.createElement("div");
                box.className = "letter-box";
                if (revealedLetters[i]) {
                    box.innerText = char.toUpperCase(); 
                }
                container.appendChild(box);
            }
        }
    }

    function guessLetter(letter) {
        if (!canGuess || gameWon) return;

        letter = letter.toLowerCase();
        if (!/^[a-z]$/.test(letter)) return; 

        const isVowel = voyelles.includes(letter);
        let countInPhrase = 0;

        if (isVowel) {
            if (score < 5) {
                document.getElementById("message").innerText = "Il faut 5 pièces pour une voyelle !";
                return;
            }
            score -= 5;
            updateScoreDisplay();
        }

        for (let i = 0; i < normalizedExpression.length; i++) {
            if (normalizedExpression[i] === letter && !revealedLetters[i]) {
                revealedLetters[i] = true;
                countInPhrase++;
            }
        }

        if (countInPhrase > 0) {
            if (!isVowel) {
                const gain = countInPhrase * currentWheelValue;
                score += gain;
                updateScoreDisplay();
                document.getElementById("message").innerText = `Trouvé ${countInPhrase} fois ! +${gain} pièces.`;
            } else {
                document.getElementById("message").innerText = `Voyelle (-5 pcs). Trouvé ${countInPhrase} fois.`;
            }
        } else {
            document.getElementById("message").innerText = `Pas de "${letter.toUpperCase()}".`;
        }

        renderPhrase();
        checkWin();
        
        canGuess = false;
        document.getElementById("mobile-input").value = "";
        
        if (!gameWon) {
            document.getElementById("spin-btn").disabled = false;
            document.getElementById("mobile-input").blur(); 
        }
    }

    function checkWin() {
        const isFullyRevealed = normalizedExpression.split("").every((char, index) => {
            return char === " " || revealedLetters[index] === true;
        });

        if (isFullyRevealed) {
            gameWon = true;
            document.getElementById("message").innerText = "FÉLICITATIONS ! Vous avez trouvé !";
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("mobile-input").blur();
            animateGarland();
        }
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = `Pièces : ${score}`;
    }

    // --- GESTION DU CLAVIER ---
    const mobileInput = document.getElementById("mobile-input");
    
    mobileInput.addEventListener("input", (e) => {
        const val = e.target.value;
        if (val.length > 0) {
            const lastChar = val[val.length - 1]; 
            const normalizedKey = normalizeString(lastChar);
            guessLetter(normalizedKey);
        }
    });

    mobileInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
        }
    });

    // --- GUIRLANDES ---
    function createGarland() {
        const garland = document.getElementById("garland");
        const colors = ['', 'red', 'green', 'blue'];
        for (let i = 0; i < 20; i++) {
            const bulb = document.createElement("div");
            bulb.className = `bulb ${colors[i % colors.length]}`;
            garland.appendChild(bulb);
        }
    }

    function turnOffGarland() {
        document.querySelectorAll('.bulb').forEach(b => b.classList.remove('on'));
    }

    function animateGarland() {
        const bulbs = document.querySelectorAll('.bulb');
        let index = 0;
        const interval = setInterval(() => {
            turnOffGarland();
            bulbs[index].classList.add('on');
            bulbs[(index + 5) % bulbs.length].classList.add('on');
            index = (index + 1) % bulbs.length;
        }, 100);

        setTimeout(() => {
            clearInterval(interval);
            bulbs.forEach(b => b.classList.add('on'));
        }, 3000);
    }

    // --- DÉMARRAGE ---
    createGarland();
    initGame();

</script>
</body>
</html>
