<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Roue de la Fortune</title>
    <style>
        :root {
            --bg-color: #2c1810;
            --wood-light: #8B4513;
            --wood-dark: #5C2E00;
            --gold: #FFD700;
            --cream: #FDF5E6;
            --red: #8B0000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--cream);
            margin: 0;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex-direction: column; 
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background: linear-gradient(145deg, #4a2c1a, #2c1810);
            border: 4px solid var(--wood-light);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            padding: 10px;
        }

        @media (min-width: 768px) {
            #game-container {
                flex-direction: row;
                height: 90vh;
                border-width: 8px;
                border-radius: 20px;
                padding: 20px;
            }
        }

        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 0;
        }

        #wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
        }

        @media (min-width: 768px) {
            #wheel-container { width: 350px; height: 350px; }
            canvas { width: 350px !important; height: 350px !important; }
        }

        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid var(--gold);
            z-index: 10;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
        }

        canvas {
            width: 280px; height: 280px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .game-btn {
            margin-top: 10px;
            padding: 10px 25px;
            font-size: 18px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid var(--wood-dark);
            transition: 0.2s;
        }

        #spin-btn {
            color: var(--wood-dark);
            background: linear-gradient(to bottom, var(--gold), #daa520);
        }

        #propose-btn {
            color: var(--gold);
            background: transparent;
            border-color: var(--gold);
        }

        .game-btn:disabled {
            background: linear-gradient(to bottom, #444, #222) !important;
            color: #666 !important;
            border-color: #444 !important;
            cursor: not-allowed;
        }

        #proposal-group {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }

        #proposal-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            background: #1a0f0a;
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 8px;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }

        .small-btn {
            padding: 6px 15px;
            font-size: 14px;
            border-radius: 20px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            border: 1px solid;
            margin: 0 5px;
        }
        #validate-btn { background: #228B22; color: white; border-color: #006400; }
        #cancel-btn { background: transparent; color: #ccc; border-color: #ccc; }

        #garland {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 25px;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 20;
        }

        .bulb {
            width: 10px; height: 10px;
            border-radius: 50%;
            background-color: #333;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }
        .bulb.on { background-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .bulb.red.on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .bulb.green.on { background-color: #33ff33; box-shadow: 0 0 8px #33ff33; }
        .bulb.blue.on { background-color: #3399ff; box-shadow: 0 0 8px #3399ff; }

        #right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto;
            cursor: pointer; 
        }

        @media (min-width: 768px) {
            #right-panel { padding-left: 40px; cursor: default; }
        }

        #phrase-display {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            margin-bottom: 20px;
            row-gap: 15px; /* Espace vertical entre les lignes */
        }

        .word-wrapper {
            display: inline-flex;
            gap: 6px; /* CORRECTION ICI : Espace entre les lettres d'un même mot */
            margin-right: 15px; /* Espace horizontal entre les mots */
        }

        .letter-box {
            width: 28px; height: 36px;
            border-bottom: 3px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: var(--gold);
        }
        @media (min-width: 768px) {
            .letter-box { width: 40px; height: 50px; font-size: 32px; }
            .word-wrapper { margin-right: 20px; gap: 10px; } /* Espace plus grand sur PC */
        }

        #message {
            height: 40px;
            font-size: 16px;
            color: #ff9999;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }
        @media (min-width: 768px) { #message { font-size: 20px; margin-bottom: 20px; } }

        #bottom-panel {
            position: absolute;
            bottom: 10px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 5;
        }

        #score-display {
            font-size: 20px;
            color: var(--gold);
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }
        @media (min-width: 768px) { #score-display { font-size: 28px; margin-bottom: 15px; } }

        #quit-btn {
            display: inline-block;
            padding: 8px 15px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            background-color: #FF69B4;
            color: #fff;
            border: 2px solid #FF1493;
            border-radius: 20px;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #quit-btn:hover { background-color: #FF1493; color: #fff; }

        #mobile-input {
            position: absolute;
            bottom: 60px; 
            left: 50%;
            transform: translateX(-50%);
            width: 1px; height: 1px;
            opacity: 0; 
            z-index: -1; 
            border: none; outline: none;
            font-size: 16px; 
            padding: 0; margin: 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="garland"></div>
    
    <input type="text" id="mobile-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div id="left-panel">
        <div id="wheel-container">
            <div id="pointer"></div>
            <canvas id="wheel" width="350" height="350"></canvas>
        </div>
        
        <button id="spin-btn" class="game-btn" onclick="spinWheel()">FAIRE TOUNER LA ROUE</button>
        <button id="propose-btn" class="game-btn" onclick="startProposal()">PROPOSER UNE SOLUTION</button>
        
        <div id="proposal-group">
            <input type="text" id="proposal-input" placeholder="Tapez votre solution..." autocomplete="off">
            <div>
                <button id="validate-btn" class="small-btn" onclick="submitProposal()">Valider</button>
                <button id="cancel-btn" class="small-btn" onclick="cancelProposal()">Annuler</button>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <div id="phrase-display"></div>
        <div id="message">Appuyez sur "Tourner" !</div>
    </div>

    <div id="bottom-panel">
        <div id="score-display">Pièces : 0</div>
        <a id="quit-btn" href="https://pierreg78-maker.github.io/village/">Retour au Village</a>
    </div>
</div>

<script>
    const expressions = [
        "Le champagne est à la bouche ce que le clair de lune est au cœur",
        "Une hirondelle ne fait pas le printemps",
        "Petit à petit l'oiseau fait son nid",
        "Quand les poules auront des dents",
        "C'est la cerise sur le gâteau",
        "Avoir le cafard",
        "Tomber dans les pommes",
        "En avoir ras le bol"
    ];

    const segments = [0, 10, "X", 5, 1, 2, 0, 10, "X", 5, 1, 2];
    const colors = ["#555555", "#006400", "#800000", "#00008B", "#808000", "#4B0082", "#666666", "#228B22", "#B22222", "#191970", "#BDB76B", "#6A0DAD"];
    const voyelles = ["a", "e", "i", "o", "u", "y"];

    let currentExpression = "";
    let normalizedExpression = "";
    let revealedLetters = [];
    let score = 0;
    let currentWheelValue = 0;
    let canGuess = false;
    let isSpinning = false;
    let gameWon = false;
    let isProposing = false;

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;
    let startAngle = 0;
    
    function drawWheel() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(startAngle);

        for (let i = 0; i < numSegments; i++) {
            const angle = i * arcSize;
            
            ctx.beginPath();
            ctx.arc(0, 0, radius - 5, angle, angle + arcSize);
            ctx.lineTo(0, 0);
            ctx.closePath();
            ctx.fillStyle = colors[i];
            ctx.fill();
            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.save();
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px Georgia";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            ctx.fillText(segments[i], radius - 25, 8);
            ctx.restore();
        }
        ctx.restore();
    }

    function spinWheel() {
        if (isSpinning || gameWon || isProposing) return;
        isSpinning = true;
        canGuess = false;
        document.getElementById("spin-btn").disabled = true;
        document.getElementById("propose-btn").disabled = true;
        document.getElementById("message").innerText = "La roue tourne...";
        
        document.getElementById("mobile-input").blur();

        let spinVelocity = Math.random() * 0.3 + 0.3; 
        const friction = 0.988;

        function animate() {
            spinVelocity *= friction;
            startAngle += spinVelocity;
            drawWheel();

            if (spinVelocity > 0.002) {
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                determinePrize();
            }
        }
        animate();
    }

    function determinePrize() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        let pointerAngleInWheelFrame = (-Math.PI / 2 - startAngle) % (2 * Math.PI);
        if (pointerAngleInWheelFrame < 0) pointerAngleInWheelFrame += 2 * Math.PI;
        
        const index = Math.floor(pointerAngleInWheelFrame / arcSize);
        currentWheelValue = segments[index];

        if (currentWheelValue === "X") {
            score = 0;
            updateScoreDisplay();
            document.getElementById("message").innerText = "Banqueroute ! Vous perdez tout.";
            enableTurnButtons();
        } else {
            document.getElementById("message").innerHTML = `Valeur : ${currentWheelValue} pièce(s).<br><span style="font-size:0.8em; color:#ccc;">Touchez l'expression pour taper une lettre</span>`;
            canGuess = true;
            document.getElementById("propose-btn").disabled = false;
        }
    }

    function normalizeString(str) {
        return str.toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
                  .replace(/ç/g, "c")
                  .trim();
    }

    function initGame() {
        currentExpression = expressions[Math.floor(Math.random() * expressions.length)];
        normalizedExpression = normalizeString(currentExpression);
        revealedLetters = new Array(currentExpression.length).fill(false);
        score = 0;
        gameWon = false;
        canGuess = false;
        isProposing = false;
        currentWheelValue = 0;
        
        updateScoreDisplay();
        renderPhrase();
        drawWheel();
        turnOffGarland();
        cancelProposal();
        
        document.getElementById("message").innerText = 'Appuyez sur "Tourner" !';
        enableTurnButtons();
        document.getElementById("mobile-input").value = "";
        document.getElementById("mobile-input").blur();
    }

    function enableTurnButtons() {
        document.getElementById("spin-btn").disabled = false;
        document.getElementById("propose-btn").disabled = false;
    }

    function renderPhrase() {
        const container = document.getElementById("phrase-display");
        container.innerHTML = "";
        
        let currentWordWrapper = document.createElement("div");
        currentWordWrapper.className = "word-wrapper";
        
        for (let i = 0; i < currentExpression.length; i++) {
            const char = currentExpression[i];
            
            if (char === " ") {
                container.appendChild(currentWordWrapper);
                currentWordWrapper = document.createElement("div");
                currentWordWrapper.className = "word-wrapper";
            } else {
                const box = document.createElement("div");
                box.className = "letter-box";
                if (revealedLetters[i]) {
                    box.innerText = char.toUpperCase(); 
                }
                currentWordWrapper.appendChild(box);
            }
        }
        container.appendChild(currentWordWrapper);
    }

    function guessLetter(letter) {
        if (!canGuess || gameWon || isProposing) return;

        letter = letter.toLowerCase();
        if (!/^[a-z]$/.test(letter)) return; 

        const isVowel = voyelles.includes(letter);
        let countInPhrase = 0;

        if (isVowel) {
            if (score < 5) {
                document.getElementById("message").innerText = "Il faut 5 pièces pour une voyelle !";
                return;
            }
            score -= 5;
            updateScoreDisplay();
        }

        for (let i = 0; i < normalizedExpression.length; i++) {
            if (normalizedExpression[i] === letter && !revealedLetters[i]) {
                revealedLetters[i] = true;
                countInPhrase++;
            }
        }

        if (countInPhrase > 0) {
            if (!isVowel) {
                const gain = countInPhrase * currentWheelValue;
                score += gain;
                updateScoreDisplay();
                document.getElementById("message").innerText = `Trouvé ${countInPhrase} fois ! +${gain} pièces.`;
            } else {
                document.getElementById("message").innerText = `Voyelle (-5 pcs). Trouvé ${countInPhrase} fois.`;
            }
        } else {
            document.getElementById("message").innerText = `Pas de "${letter.toUpperCase()}".`;
        }

        renderPhrase();
        checkWin();
        
        canGuess = false;
        document.getElementById("mobile-input").value = "";
        
        if (!gameWon) {
            enableTurnButtons();
            document.getElementById("mobile-input").blur(); 
        }
    }

    function checkWin() {
        const isFullyRevealed = normalizedExpression.split("").every((char, index) => {
            return char === " " || revealedLetters[index] === true;
        });

        if (isFullyRevealed) {
            triggerWin();
        }
    }

    function triggerWin() {
        gameWon = true;
        revealedLetters.fill(true);
        renderPhrase();
        document.getElementById("message").innerText = "FÉLICITATIONS ! Vous avez trouvé !";
        document.getElementById("spin-btn").disabled = true;
        document.getElementById("propose-btn").disabled = true;
        document.getElementById("mobile-input").blur();
        document.getElementById("proposal-group").style.display = "none";
        animateGarland();
    }

    function startProposal() {
        if (gameWon || isSpinning) return;
        isProposing = true;
        canGuess = false;
        
        document.getElementById("spin-btn").disabled = true;
        document.getElementById("propose-btn").disabled = true;
        document.getElementById("proposal-group").style.display = "flex";
        document.getElementById("proposal-input").value = "";
        document.getElementById("message").innerText = "Tapez votre solution :";
        
        setTimeout(() => document.getElementById("proposal-input").focus(), 100);
    }

    function cancelProposal() {
        isProposing = false;
        document.getElementById("proposal-group").style.display = "none";
        document.getElementById("proposal-input").blur();
        if (!gameWon && !isSpinning) {
            enableTurnButtons();
            document.getElementById("message").innerText = "Tournez la roue ou proposez une solution.";
        }
    }

    function submitProposal() {
        const inputElement = document.getElementById("proposal-input");
        const playerGuess = normalizeString(inputElement.value);

        if (playerGuess === "") {
            document.getElementById("message").innerText = "Veuillez taper une expression.";
            return;
        }

        if (playerGuess === normalizedExpression) {
            triggerWin();
        } else {
            document.getElementById("message").innerText = "Mauvaise réponse ! Vous pouvez retenter.";
            cancelProposal();
        }
    }

    document.getElementById("proposal-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            submitProposal();
        }
    });

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = `Pièces : ${score}`;
    }

    const mobileInput = document.getElementById("mobile-input");
    
    mobileInput.addEventListener("input", (e) => {
        const val = e.target.value;
        if (val.length > 0) {
            const lastChar = val[val.length - 1]; 
            const normalizedKey = normalizeString(lastChar);
            guessLetter(normalizedKey);
        }
    });

    mobileInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") e.preventDefault();
    });

    document.getElementById("right-panel").addEventListener("click", function() {
        if (canGuess && !gameWon && !isProposing) {
            mobileInput.focus();
        }
    });

    function createGarland() {
        const garland = document.getElementById("garland");
        const colors = ['', 'red', 'green', 'blue'];
        for (let i = 0; i < 20; i++) {
            const bulb = document.createElement("div");
            bulb.className = `bulb ${colors[i % colors.length]}`;
            garland.appendChild(bulb);
        }
    }

    function turnOffGarland() {
        document.querySelectorAll('.bulb').forEach(b => b.classList.remove('on'));
    }

    function animateGarland() {
        const bulbs = document.querySelectorAll('.bulb');
        let index = 0;
        const interval = setInterval(() => {
            turnOffGarland();
            bulbs[index].classList.add('on');
            bulbs[(index + 5) % bulbs.length].classList.add('on');
            index = (index + 1) % bulbs.length;
        }, 100);

        setTimeout(() => {
            clearInterval(interval);
            bulbs.forEach(b => b.classList.add('on'));
        }, 3000);
    }

    createGarland();
    initGame();

</script>
</body>
</html>
